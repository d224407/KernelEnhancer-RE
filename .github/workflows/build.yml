name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      major_bump:
        description: 'Major version bump?'
        required: true
        default: 'no'
        type: choice
        options:
          - yes
          - no

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CFLAGS: "-Oz -flto -ffunction-sections -fdata-sections -fno-unwind-tables -fno-asynchronous-unwind-tables -Wl,--gc-sections -s"

    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Find source variants
        id: variants
        run: |
          VARIANTS=()
          for f in src/KernelEnhancer*.c; do
            base=$(basename "$f" .c)
            suffix=${base#KernelEnhancer}
            if [[ -z "$suffix" ]]; then
              VARIANTS+=("main")
            else
              suffix=${suffix#-}
              VARIANTS+=("$suffix")
            fi
          done
          if [ ${#VARIANTS[@]} -eq 0 ]; then
            echo "No source files found!"
            exit 1
          fi
          VARIANTS_STR=$(IFS=,; echo "${VARIANTS[*]}")
          echo "variants=$VARIANTS_STR" >> $GITHUB_OUTPUT
          echo "variant_count=${#VARIANTS[@]}" >> $GITHUB_OUTPUT

      - name: Generate changelog and bump version
        id: bump_version
        run: |
          VERSION_RAW=$(grep "^version=" template/module.prop | cut -d'=' -f2)
          VERSION=${VERSION_RAW#v}
          VERSION_CODE=$(grep "^versionCode=" template/module.prop | cut -d'=' -f2)

          MAJOR=$(echo "$VERSION" | cut -d'.' -f1)
          MINOR=$(echo "$VERSION" | cut -d'.' -f2)
          if [[ -z "$MINOR" ]]; then MINOR=0; fi

          MAJOR_BUMP="${{ github.event.inputs.major_bump }}"
          if [[ "$MAJOR_BUMP" == "yes" ]]; then
            NEW_MAJOR=$((MAJOR + 1))
            NEW_MINOR=0
            NEW_VERSION_CODE=$((VERSION_CODE + 10))
          else
            NEW_MAJOR=$MAJOR
            NEW_MINOR=$((MINOR + 1))
            NEW_VERSION_CODE=$((VERSION_CODE + 1))
          fi
          NEW_VERSION="${NEW_MAJOR}.${NEW_MINOR}"

          sed -i "s/^version=v.*/version=v${NEW_VERSION}/" template/module.prop
          sed -i "s/^versionCode=.*/versionCode=${NEW_VERSION_CODE}/" template/module.prop

          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -n "$LATEST_TAG" ]]; then
            COMMITS=$(git log "$LATEST_TAG"..HEAD --pretty=format:"%s|%ad" --date=short)
          else
            COMMITS=$(git log --pretty=format:"%s|%ad" --date=short)
          fi

          echo "# Changelog" > CHANGELOG_new.md
          echo "" >> CHANGELOG_new.md
          echo "## v${NEW_VERSION} - $(date +'%Y-%m-%d')" >> CHANGELOG_new.md
          echo "" >> CHANGELOG_new.md
          echo "### Changes" >> CHANGELOG_new.md

          declare -A DATE_MAP
          while IFS= read -r line; do
            if [[ -z "$line" ]]; then continue; fi
            msg="${line%|*}"
            date="${line#*|}"
            if [[ "$msg" == !* ]]; then continue; fi
            if [[ -z "${DATE_MAP[$date]}" ]]; then
              DATE_MAP[$date]="$msg"
            else
              DATE_MAP[$date]="${DATE_MAP[$date]}\n- $msg"
            fi
          done <<< "$COMMITS"

          for date in "${!DATE_MAP[@]}"; do
            echo "#### $date" >> CHANGELOG_new.md
            echo "- ${DATE_MAP[$date]}" >> CHANGELOG_new.md
          done

          if [[ -f "CHANGELOG.md" ]]; then
            tail -n +2 CHANGELOG.md >> CHANGELOG_new.md
          fi
          mv CHANGELOG_new.md CHANGELOG.md

          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "new_version_code=${NEW_VERSION_CODE}" >> $GITHUB_OUTPUT

      - name: Build all variants
        run: |
          NDK=${{ steps.setup-ndk.outputs.ndk-path }}
          ARCHS=("armv7" "armv8" "x86" "x86_64")
          declare -A CLANG
          CLANG["armv7"]="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
          CLANG["armv8"]="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          CLANG["x86"]="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android21-clang"
          CLANG["x86_64"]="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"

          VARIANT_LIST=($(echo "${{ steps.variants.outputs.variants }}" | tr ',' ' '))
          for variant in "${VARIANT_LIST[@]}"; do
            if [[ "$variant" == "main" ]]; then
              SRC="src/KernelEnhancer.c"
            else
              SRC="src/KernelEnhancer-${variant}.c"
            fi
            for arch in "${ARCHS[@]}"; do
              mkdir -p "build/${arch}/${variant}"
              ${CLANG[$arch]} $CFLAGS -o "build/${arch}/${variant}/kernelenhancer" "$SRC"
              "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all "build/${arch}/${variant}/kernelenhancer"
            done
          done

      - name: Prepare modules and update.json for each variant
        run: |
          VARIANT_LIST=($(echo "${{ steps.variants.outputs.variants }}" | tr ',' ' '))
          NEW_VERSION="${{ steps.bump_version.outputs.new_version }}"
          NEW_VERSION_CODE="${{ steps.bump_version.outputs.new_version_code }}"
          REPO="${{ github.repository }}"

          for variant in "${VARIANT_LIST[@]}"; do
            MODULE_DIR="KernelEnhancer${variant:+-$variant}"
            mkdir -p "$MODULE_DIR/system/bin"
            cp -r template/* "$MODULE_DIR/" 2>/dev/null || true
            cp "build/armv7/${variant}/kernelenhancer" "$MODULE_DIR/system/bin/kernelenhancer_32"
            cp "build/armv8/${variant}/kernelenhancer" "$MODULE_DIR/system/bin/kernelenhancer_64"
            cp "build/x86/${variant}/kernelenhancer" "$MODULE_DIR/system/bin/kernelenhancer_x86"
            cp "build/x86_64/${variant}/kernelenhancer" "$MODULE_DIR/system/bin/kernelenhancer_x64"
            chmod 755 "$MODULE_DIR/system/bin/"*
            find "$MODULE_DIR" -type f -name "*.sh" -exec chmod 755 {} +
            cd "$MODULE_DIR" && zip -r9 "../KernelEnhancer${variant:+-$variant}.zip" . && cd ..

            if [[ "$variant" == "main" ]]; then
              ZIP_NAME="KernelEnhancer.zip"
              JSON_NAME="update.json"
            else
              ZIP_NAME="KernelEnhancer-${variant}.zip"
              JSON_NAME="update-${variant}.json"
            fi

            cat > "$JSON_NAME" << EOF
{
  "version": "${NEW_VERSION}",
  "versionCode": "${NEW_VERSION_CODE}",
  "zipUrl": "https://github.com/${REPO}/releases/tag/v${NEW_VERSION}/${ZIP_NAME}",
  "changelog": "https://github.com/${REPO}/blob/main/CHANGELOG.md"
}
EOF
          done

      - name: Commit and push all changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add template/module.prop CHANGELOG.md update*.json KernelEnhancer*.zip 2>/dev/null || true
          git commit -m "chore: bump version to v${{ steps.bump_version.outputs.new_version }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main || git push origin HEAD:master

      - name: Create Release
        if: github.ref_name == 'main' || github.ref_name == 'master'
        uses: softprops/action-gh-release@master
        with:
          tag_name: v${{ steps.bump_version.outputs.new_version }}
          name: v${{ steps.bump_version.outputs.new_version }}
          body: |
            ## KernelEnhancer v${{ steps.bump_version.outputs.new_version }}
            📦 **Downloads**:
            ${{ steps.variants.outputs.variants }}
            🔗 **Changelog**: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md
          draft: false
          prerelease: false
          files: KernelEnhancer*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@main
        with:
          name: KernelEnhancer-Builds
          path: |
            KernelEnhancer*.zip
            update*.json